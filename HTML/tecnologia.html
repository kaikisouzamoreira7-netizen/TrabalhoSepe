<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Roma Antiga</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="CSS/reset.css">
  <link rel="stylesheet" href="CSS/login.css">
</head>

<body>
  <main class="login-container">
    <section class="login-box">
      <h1>ROMA</h1>

      <div id="loginView">
        <h2>Entrar</h2>

        <p class="descricao">Acesse sua conta para continuar.</p>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        </div>

        <button type="button">ENTRAR</button>

        <p id="mensagem"></p>

        <a id="voltar" href="../index.html">VOLTAR</a>

        <div class="cadastro">
          <p>Ainda não possui uma conta?</p>
          <button type="button" id="cadastrarBtn">CRIAR CONTA</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-info">
        <img id="logo-Footer" src="CSS/IMG/ROMA.jpg" alt="roma-logo">
      </div>

      <div class="footer-links">
        <a href="quiz.html">Quiz</a>
        <a href="fontes.html">Fontes</a>
        <a href="forms.html">Fale Conosco</a>
      </div>

      <div class="footer-cadastro">
        <h3>CADASTRE-SE</h3>
        <input type="text" placeholder="Nome">
        <input type="email" placeholder="E-mail">
        <button type="button">CADASTRAR</button>
      </div>
    </div>

    <div class="footer-redes">
      <a href="https://wa.me/5547996095892" target="_blank">
        <img src="CSS/IMG/whatsapp 1.svg" alt="WhatsApp">
      </a>

      <a href="https://www.instagram.com/romaantigasepe/" target="_blank">
        <img src="CSS/IMG/instagram 1.svg" alt="Instagram">
      </a>
    </div>

    <div class="footer-bottom">
      <p>© 2026 Roma Antiga — SEPE</p>
    </div>
  </footer>
</body>

</html>
